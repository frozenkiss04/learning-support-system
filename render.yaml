# ============================================================
# Render Blueprint — deploy backend Flask (frontend deploy riêng trên Vercel).
# Tạo service: Render Dashboard > New > Blueprint > chọn repo này.
# Root directory của service là backend/ (khai báo rootDir bên dưới).
#
# Phương án thay thế: deploy dạng Docker bằng backend/Dockerfile
# (đổi runtime: docker, dockerfilePath: ./Dockerfile, bỏ build/startCommand).
#
# --- Deploy chạy migration trước, seed sau (xem startCommand bên dưới) ---
# Thư mục migrations/ đã có Alembic env + migration đầu tiên khớp toàn bộ
# schema hiện tại. Mỗi lần deploy, startCommand chạy:
#   flask db upgrade && flask seed && gunicorn ...
# (seed idempotent, chạy lại an toàn; `flask seed` vẫn tự db.create_all()
# như lưới an toàn). Khi đổi schema: ở máy dev chạy `flask db migrate`
# rồi commit file migration mới. Khi đã dùng gói trả phí, có thể chuyển
# `flask db upgrade` sang preDeployCommand (chỉ khả dụng ở plan trả phí).
# ============================================================
services:
  - type: web
    name: learning-support-api
    region: singapore # gần người dùng VN + cùng region với Neon (ap-southeast-1) để giảm độ trễ API
    runtime: python
    rootDir: backend
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    # $PORT do Render cấp — không hardcode cổng. Worker/thread khớp Dockerfile.
    startCommand: flask --app wsgi db upgrade && flask --app wsgi seed && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --worker-class gthread --timeout 120 --access-logfile - --error-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_ENV
        value: production
      # --- Secret: Render tự sinh, không lưu trong repo ---
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # --- Bắt buộc nhập tay trong Dashboard (sync: false = không sync về repo) ---
      - key: DATABASE_URL # Neon POOLED connection string (host có -pooler)
        sync: false
      - key: CORS_ORIGINS # domain FE Vercel, vd https://your-frontend.vercel.app
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY # chỉ bắt buộc nếu AI_PROVIDER=gemini
        sync: false
      - key: OPENAI_API_KEY # chỉ bắt buộc nếu AI_PROVIDER=openai
        sync: false
      # --- Giá trị mặc định, sửa được trên Dashboard ---
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: AI_DAILY_LIMIT
        value: "50"
      - key: WEB_CONCURRENCY
        value: "2"
