name: Keep warm (Render free)

# Render free web services spin down after ~15 minutes without traffic,
# and the next request pays a ~1 minute cold start. Ping /health every
# 13 minutes so the API stays warm. Manual runs allowed for testing.
on:
  schedule:
    - cron: "*/13 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    name: Ping API health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Curl /health (cold start can take a while)
        run: curl -fsS --retry 2 --retry-delay 10 --max-time 120 https://learning-support-api-sg.onrender.com/health
