name: CD — Deploy Render + Vercel

# Runs after CI passes on main, or manually from the Actions tab.
# Each job no-ops with a clear notice when its secrets are not configured yet,
# so this workflow is safe to keep in the repo before the platforms are connected.
# NOTE: GitHub does not allow the `secrets` context inside `if:` conditions,
# so secrets are mapped to job env first and steps check `env.*` instead.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend — Render
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Notice when Render is not connected yet
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "::notice::RENDER_DEPLOY_HOOK_URL chua duoc cau hinh trong GitHub Secrets."
          echo "Tao service tren Render (New > Blueprint, chon repo nay) roi lay Deploy Hook:"
          echo "Render Dashboard > service learning-support-api > Settings > Deploy Hook."
          echo "Them vao GitHub: Settings > Secrets and variables > Actions > RENDER_DEPLOY_HOOK_URL"

      - name: Trigger Render deploy hook
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

  deploy-frontend:
    name: Deploy frontend — Vercel
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Notice when Vercel is not connected yet
        if: ${{ env.VERCEL_TOKEN == '' }}
        working-directory: .
        run: |
          echo "::notice::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID chua duoc cau hinh."
          echo "Import repo tren Vercel (Root Directory = frontend, env VITE_API_URL = URL Render),"
          echo "sau do them 3 secrets tren vao GitHub de CD tu dong deploy moi lan push main."

      - uses: actions/checkout@v4
        if: ${{ env.VERCEL_TOKEN != '' }}

      - uses: actions/setup-node@v4
        if: ${{ env.VERCEL_TOKEN != '' }}
        with:
          node-version: "20"

      - name: Install dependencies
        if: ${{ env.VERCEL_TOKEN != '' }}
        # vercel build does NOT install deps on a local runner — vite would be missing.
        run: npm ci

      - name: Deploy to Vercel (production)
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          # Public API URL (GitHub repo variable). Process env wins over the
          # .env.production.local that `vercel pull` writes, so the bundle is
          # guaranteed to carry the right API base even if the pulled value is
          # a "[SENSITIVE]" placeholder.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
